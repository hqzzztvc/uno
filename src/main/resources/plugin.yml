name: LegallyNotUno
# Filled in from <version> in pom.xml at build time, so there is exactly one place to bump.
# The update checker compares it with the newest version number on Modrinth.
version: '${project.version}'
main: com.legallynotuno.LegallyNotUno
# The OLDEST server the jar runs on, and the paper-api it is built against (see pom.xml):
# Paper refuses a plugin that declares a newer version than its own. One jar covers
# 1.21.4 to 26.3; the held fan needs 1.21.4, so this cannot go lower.
api-version: '1.21.4'
description: Legally Not Uno — a multiplayer card game with placeable tables, a hand of cards held in first person, and optional stakes.
author: ankur
website: https://modrinth.com/project/legallynotuno
folia-supported: false

# All read reflectively, so the plugin builds and runs identically with none of them
# installed. ItemsAdder/Oraxen/Nexo: a theme naming a block they own falls back to the
# vanilla block written after the pipe in themes.yml. Vault: without it (or without an
# economy registered with it) wagers are items only.
softdepend: [ItemsAdder, Oraxen, Nexo, Vault]

commands:
  uno:
    description: Legally Not Uno game and table commands.
    usage: /uno <help|join|ready|bet|start|give|theme>
    permission: legallynotuno.play
  gamble:
    description: Wager items or money on a hand — winner takes the pot.
    usage: /gamble [<amount>|ready|out|pot|go|cancel|ride|cash]
    aliases: [letitride, ante, bet]
    permission: legallynotuno.gamble

permissions:
  legallynotuno.admin:
    description: Legally Not Uno admin commands (tables, themes, force-end, refunds, reload) and update notices.
    default: op
  legallynotuno.play:
    description: Allows a player to sit and play at the tables.
    default: true
  legallynotuno.gamble:
    description: Allows a player to stake items or money on a hand.
    default: true
