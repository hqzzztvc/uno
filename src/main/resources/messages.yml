  pot-label-ride: "<gold><bold>POT</bold> <pot> <gray>· <player> deciding…"
  pot-label-won: "<gold><bold><player></bold> <gray>takes <pot>"

escrow:
  returned: "<prefix><gray>returned <yellow><items> <gray>item(s) held from an unfinished bet."
  returned-money: "<prefix><gray>returned <gold><money> <gray>held from an unfinished bet."
  inventory-full: "<gray>Your inventory was full — the rest dropped at your feet."

# Which layout this file is in. Legally Not Uno updates it when it updates the file -- leave it be.
messages-version: 1
