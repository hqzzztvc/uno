# ============================================================
#  UNO — player-facing text
# ============================================================
#
#  Every string the plugin shows a player lives here. Reword, restyle or translate
#  freely, then run /uno reload.
#
#  Formatting is MiniMessage: <red>, <gold>, <bold>, <gradient:...>, <click:...>.
#  See https://docs.advntr.dev/minimessage/format.html
#
#  <placeholders> are substituted by the plugin and are inserted as plain text, so a
#  player called "<red>x" can't inject colour. Each message lists the ones it accepts;
#  you may drop any of them, but a name the plugin doesn't supply stays as literal text.
#
#  Keys missing from this file fall back to the version shipped inside the jar, so a
#  partial file is safe — you only need to list what you want to change.

# Prepended wherever a message uses <prefix>.
prefix: "<gold><bold>UNO</bold></gold> <dark_gray>|</dark_gray> "

common:
  no-permission: "<red>You don't have permission."
  players-only: "<red>Only players can do that."
  unknown-subcommand: "<gray>Unknown subcommand. Try <yellow>/<command> help<gray>."
  debug-disabled: "<red>That's a debug command. Set <yellow>debug: true<red> in config.yml to use it."
  number-expected: "<red>'<value>' isn't a number."

plugin:
  header: "<gold>UNO <gray>v<version> <dark_gray>| <gray>/uno help"
  version: "<gold>UNO <gray>v<version>"
  reloaded: "<green>UNO config and messages reloaded."
  help-header: "<gold><bold>UNO</bold> <dark_gray>— commands"
  help-join: "<yellow>/uno join <gray>— sit at the table you're standing next to"
  help-leave: "<yellow>/uno leave <gray>— get up (or press <gold>Shift<gray>)"
  help-play: "<yellow>/uno start [bots] <gray>— deal a hand to everyone at your table"
  help-quit: "<yellow>/uno quit <gray>— drop out of the hand you're in (others play on)"
  help-stop: "<yellow>/uno stop <gray>— end the hand at your table for everyone"
  help-gamble: "<yellow>/gamble <gray>— wager items on a hand (see <yellow>/gamble help<gray>)"
  help-version: "<yellow>/uno version <gray>— plugin version"
  help-admin-header: "<dark_gray>— admin —"
  help-createtable: "<yellow>/uno createtable <theme> <gray>— build a table in front of you (cherry, darkcherry, spruce, strippedoak)"
  help-remove: "<yellow>/uno remove <gray>— remove the nearest table"
  help-list: "<yellow>/uno list <gray>— every placed table"
  help-info: "<yellow>/uno info <gray>— running games and open pots"
  help-tp: "<yellow>/uno tp <id> <gray>— teleport to a table"
  help-end: "<yellow>/uno end <player|all> <gray>— force a hand to finish"
  help-refund: "<yellow>/uno refund <player|all> <gray>— settle a stuck pot back to its stakers"
  help-reload: "<yellow>/uno reload <gray>— re-read config.yml and messages.yml"

