# ============================================================
#  Legally Not Uno — player-facing text
# ============================================================
#
#  Every string the plugin shows a player lives here. Reword, restyle or translate
#  freely, then run /uno reload.
#
#  Formatting is MiniMessage: <red>, <gold>, <bold>, <gradient:...>, <click:...>.
#  See https://docs.advntr.dev/minimessage/format.html
#
#  <placeholders> are substituted by the plugin and are inserted as plain text, so a
#  player called "<red>x" can't inject colour. Each message lists the ones it accepts;
#  you may drop any of them, but a name the plugin doesn't supply stays as literal text.
#
#  Updating the plugin keeps every line you've changed. New messages are added to this
#  file, and lines you never touched follow the new wording; the old copy goes in
#  backups/. A key missing from the file falls back to the version inside the jar.

# Prepended wherever a message uses <prefix>.
prefix: "<gold><bold>Legally Not Uno</bold></gold> <dark_gray>|</dark_gray> "

common:
  no-permission: "<red>You don't have permission."
  players-only: "<red>Only players can do that."
  unknown-subcommand: "<gray>Unknown subcommand. Try <yellow>/<command> help<gray>."
  debug-disabled: "<red>That's a debug command. Set <yellow>debug: true<red> in config.yml to use it."
  number-expected: "<red>'<value>' isn't a number."

plugin:
  header: "<gold>Legally Not Uno <gray>v<version> <dark_gray>| <gray>/uno help"
  version: "<gold>Legally Not Uno <gray>v<version>"
  reloaded: "<green>Reloaded config.yml, messages.yml and themes.yml."
  help-header: "<gold><bold>Legally Not Uno</bold> <dark_gray>— commands"
  help-join: "<yellow>/uno join <gray>— sit at the table you're standing next to"
  help-ready: "<yellow>/uno ready <gray>— you're in; the hand deals when everyone is"
  help-bet: "<yellow>/uno bet [amount] <gray>— play this one for stakes instead"
  help-leave: "<yellow>/uno leave <gray>— get up (or press <gold>Shift<gray>)"
  help-play: "<yellow>/uno start [bots] <gray>— deal now, without waiting for everyone"
  help-quit: "<yellow>/uno quit <gray>— drop out of the hand you're in (others play on)"
  help-stop: "<yellow>/uno stop <gray>— end the hand at your table for everyone"
  help-uno: "<yellow>/uno uno <gray>— call UNO when you are down to one card"
  help-callout: "<yellow>/uno callout <player> <gray>— catch someone on one card who never called"
  help-gamble: "<yellow>/gamble <gray>— wager items or money (see <yellow>/gamble help<gray>)"
  help-version: "<yellow>/uno version <gray>— plugin version"
  help-admin-header: "<dark_gray>— admin —"
  help-give: "<yellow>/uno give <theme> <gray>— a placeable table item; right-click the ground with it"
  help-theme: "<yellow>/uno theme <list|create|edit|delete> [id] <gray>— design the blocks a table is built from"
  help-remove: "<yellow>/uno remove <gray>— remove the nearest table"
  help-list: "<yellow>/uno list <gray>— every placed table"
  help-info: "<yellow>/uno info <gray>— running games and open pots"
  help-tp: "<yellow>/uno tp <id> <gray>— teleport to a table"
  help-end: "<yellow>/uno end <player|all> <gray>— force a hand to finish"
  help-refund: "<yellow>/uno refund <player|all> <gray>— settle a stuck pot back to its stakers"
  help-reload: "<yellow>/uno reload <gray>— re-read config.yml, messages.yml and themes.yml"
  # <file> is config.yml, messages.yml or themes.yml; <error> is what's wrong and where.
  reload-failed: "<red>Couldn't reload <file>: <gray><error>. <red>It's unchanged, and what it said before is still in use."
  # Told to admins (legallynotuno.admin) as they join and in /uno version, after asking Modrinth.
  # <latest> and <current> are version numbers; <download> is the button below, which
  # opens the plugin's Modrinth page. Blank a line to stop it being sent.
  update-available: "<gold>Legally Not Uno <white><latest></white> is out <gray>(you're on <current>) <download>"
  update-download-button: "<aqua><underlined>Download</underlined>"
  update-current: "<gray>Legally Not Uno is up to date <dark_gray>(<current>)"

table:
  # Shown the moment a player sits down, and again when a hand finishes. <ready> and <bet>
  # are the two buttons below — the "-casual" variants are used where this server has
  # gambling switched off, or the player lacks legallynotuno.gamble.
  choose: "<gray>How are we playing? <ready> <dark_gray>·<gray> <bet>"
  choose-casual: "<gray>Ready when you are: <ready>"
  again: "<gray>Another hand? <ready> <dark_gray>·<gray> <bet>"
  again-casual: "<gray>Another hand? <ready>"
  choose-ready-button: "<green><bold>[ READY ]</bold>"
  choose-bet-button: "<gold><bold>[ FOR STAKES ]</bold>"
  given: "<green>Here's a <variant>. <gray>Right-click the ground with it to place it."
  item-stale: "<red>That table item's theme no longer exists. <gray>Ask an admin for a new one."
  pick-variant: "<yellow>Which theme? <gray><variants>"
  unknown-type: "<red>No such table. <gray>Pick one of: <yellow><variants>"
  placed: "<green><variant> built. <gray>Walk up to it and type <yellow>/uno join<gray> to sit."
  no-room: "<red>No room there — aim at open, level ground with 2 blocks clear all round."
  protected: "<red>That block is part of a card table. <gray>Use <yellow>/uno remove<gray> to take it down."
  too-close: "<red>Too close to another table — give it more room."
  world-limit: "<red>This world already has its limit of <limit> table(s)."
  removed: "<green>Removed the nearest table."
  none-near: "<red>No table within <radius> blocks. <gray>Walk up to one and try again."
  busy: "<red>That table is in use — finish the hand (or <yellow>/uno end<red>) before removing it."
  full: "<red>Every seat at that table is taken."
  sit: "<green>You sit down. <gray>Press <gold>Shift <gray>or <yellow>/uno leave <gray>to get up."
  seat-taken: "<red>That seat is taken."
  already-seated: "<yellow>You're already seated. Press <gold>Shift <yellow>to leave first."
  not-seated: "<gray>You aren't sitting at a table."
  leave: "<gray>You leave the table."
  stand-forfeit: "<red>You stood up, so you're out of the hand. <gray>Sit back down and deal again when you're ready."
  list-header: "<gold><bold>Tables</bold> <dark_gray>— <count> placed"
  list-entry: "<dark_gray> · <yellow><id> <gray><world> <white><x>, <y>, <z> <dark_gray>[<gray><seated>/<seats> seated<dark_gray>]"
  list-empty: "<gray>No tables yet. <yellow>/uno give <theme><gray> to get one to place."
  not-found: "<red>No table with id starting <yellow><id><red>."
  teleported: "<green>Teleported to table <yellow><id><green>."
  pending-world: "<dark_gray> · <yellow><id> <gray><world> <dark_red>(world not loaded — kept on file)"

theme:
  list-header: "<gold><bold>Table themes</bold> <dark_gray>— <count> available"
  list-entry: "<dark_gray> · <yellow><id> <gray><name> <dark_gray>(<kind>)"
  need-id: "<yellow>Name the theme. <gray>e.g. <yellow>/uno theme create marble"
  bad-id: "<red>That isn't a usable theme name."
  built-in-locked: "<red><theme> is a built-in theme. <gray>Make a copy under a new name instead."
  editor-opened: "<gray>Fill the <yellow>3×3<gray> grid with the table top and the <yellow>four edge slots<gray> with seat blocks, then click <green>Save<gray>."
  editor-cancelled: "<gray>Theme editor closed — nothing saved. <gray>Your blocks are back in your inventory."
  incomplete: "<red>Every grid slot and all four seat slots need a block in them."
  saved: "<green>Saved theme <yellow><theme><green>. <gray>Hand it out with <yellow>/uno give <theme><gray>."
  deleted: "<green>Deleted theme <yellow><theme><green>."
  undeletable: "<red>Can't delete <yellow><theme><red> — it's built in, missing, or the only one left."
  file-broken: "<red>themes.yml has a mistake in it, so nothing can be saved to it. <gray>Fix it, run <yellow>/uno reload<gray>, then save again."

game:
  started: "<gold><bold>Game on</bold> <gray>— <count> players. Good luck!"
  controls: "<gray>A/D or wheel = pick · <green>left-click/Q = play <gray>· <yellow>right-click/F = draw"
  already-in-game: "<yellow>You're already in a game. Finish it first."
  other-in-game: "<red><player> is already in a game."
  table-in-use: "<yellow>A hand is already running at that table. Wait for it to finish, or move to another table."
  table-has-bet: "<yellow>There's a bet open at this table. <gray>Ante up with <gold>/gamble<gray>, or wait for it to settle."
  sit-first: "<yellow>Sit at a table first <gray>(stand next to one and <gold>/uno join<gray>)<yellow>, then <gold>/uno ready<yellow>."
  sit-first-play: "<yellow>Sit at a table first <gray>(stand next to one and <gold>/uno join<gray>)<yellow>, then run <gold>/uno play <bots><yellow>."
  tables-unavailable: "<red>Tables aren't available right now."
  need-players: "<yellow>Need at least 2 players — sit a friend down, or add bots: <gold>/uno start <bots><yellow>."
  # --- ready-up ---
  ready: "<green><player> is ready <gray>(<ready>/<seated>)"
  already-ready: "<gray>You're already ready. Waiting on the others."
  ready-waiting: "<gray>Waiting on <yellow><count><gray> more. <deal>"
  ready-alone: "<gray>Nobody else is sitting here yet. Wait for someone, or play the bots: <yellow>/uno start 3<gray>."
  deal-now-button: "<yellow>[ DEAL NOW ]"
  event: "<gray><event>"
  win: "<gold><bold><player> wins!</bold>"
  left: "<red><player> left the hand."
  bossbar: "<white>Top: <gold><top>  <white>| Colour: <colour>  <white>| Turn: <aqua><player> <dir>  <white>| Deck: <gray><deck>"
  # Playing a wild puts the four colours in chat, laid out the way they sit on the card: red and
  # blue on top, yellow and green underneath. Every button is exactly 62px wide in Minecraft's
  # default font, which is what lines both columns up. Bold capitals are 7px, bold spaces and
  # brackets 5px, a plain space 4px, and the words differ by 7s, so bold spaces alone can't pad
  # them evenly. That is why some padding sits outside </bold>. Rewording a button means
  # re-padding it to 62.
  colour-prompt: "<gray>Pick a colour for your wild:<newline>  <red_button>  <blue_button><newline>  <yellow_button>  <green_button>"
  colour-red-button: "<red><bold>[   RED</bold>    <bold>]"
  colour-blue-button: "<blue><bold>[</bold>   <bold>BLUE</bold>   <bold>]"
  colour-yellow-button: "<yellow><bold>[ YELLOW ]"
  colour-green-button: "<green><bold>[ </bold> <bold>GREEN</bold>  <bold>]"
  no-colour: "<gray>There's no wild waiting on a colour from you."
  # Shown the moment the turn comes round. The bar stays up for the whole turn, and only
  # the player whose turn it is can see it.
  your-turn-title: "<gold><bold>YOUR TURN"
  your-turn-subtitle: "<gray>left-click to play · right-click to draw"
  # No colour here on purpose: the line and its bar take the colour to play. Writing one in pins the text.
  your-turn-bar: "<bold>▶ YOUR TURN ◀"
  uno: "<gold><bold><player> has UNO!</bold> <gray>One card left."
  uno-title: "<gold><bold>UNO!"
  uno-subtitle: "<gray>One card left"
  start-title: "<gold><bold>Legally Not Uno"
  start-subtitle: "<gray><count> players — good luck"
  win-title: "<gold><bold><player> wins!"
  win-subtitle: "<gray>Hand over"
  turn-warning: "<yellow><seconds>s to play — or your turn is taken for you."
  turn-timeout: "<gray><player> took too long — drew a card and passed."
  ended-by-admin: "<red>An admin ended this hand."
  not-in-game: "<gray>You aren't in a hand right now."
  stopped: "<green>Hand ended."
  stop-wagered: "<red>There's a pot on this hand — <yellow>/uno stop<red> can't settle a wager. Use <yellow>/uno quit<red> to drop out (your stake stays in the pot)."
  info-header: "<gold><bold>Legally Not Uno</bold> <dark_gray>— <games> game(s), <bets> open pot(s)"
  info-game: "<dark_gray> · <gray>hand at <yellow><table> <dark_gray>[<white><players><dark_gray>] turn: <aqua><turn>"
  info-bet: "<dark_gray> · <gray>pot at <yellow><table> <dark_gray>[<white><state><dark_gray>] <gold><items> <gray>item(s) from <white><stakers>"
  info-none: "<gray>Nothing running."
  ended: "<green>Ended <count> hand(s)."
  end-none: "<gray>No matching hand to end."

  # --- house rules ---
  jump-in: "<aqua><player> jumped in!"
  stack-building: "<gold><player> <gray>must stack or draw <yellow><count><gray>."
  stack-you-can: "<gold>Stack or draw <yellow><count><gold>! <gray>Play a draw card to pass it on, or right-click to take them."
  stack-you-cant: "<red>You owe <yellow><count><red> cards — nothing to stack with. <gray>Right-click to take them."
  swap-title: "<dark_gray>Whose hand do you want?"
  swap-entry: "<yellow><player> <gray>(<count> cards)"
  draw4-prompt: "<gold>A Wild +4 is aimed at you. <challenge> <accept>"
  draw4-challenge-button: "<red>[ CHALLENGE IT ]"
  draw4-accept-button: "<gray>[ TAKE THE 4 ]"
  no-challenge: "<gray>There's no +4 waiting on you."
  # --- calling UNO ---
  uno-call-prompt: "<gold><bold>ONE CARD!</bold> <gray>Call it within <yellow><seconds>s<gray>: <button>"
  uno-call-button: "<gold>[ CALL UNO! ]"
  uno-callout-prompt: "<yellow><player> <gray>is down to one card and hasn't called: <button>"
  uno-callout-button: "<red>[ CALL THEM OUT ]"
  uno-called: "<gold><bold>UNO!</bold> <yellow><player> <gray>called it."
  uno-safe: "<gray>You're safe — nobody caught you."
  uno-not-enabled: "<gray>Calling UNO isn't switched on here — the table calls it for you."
  uno-not-on-one: "<gray>You're not down to one card."
  callout-caught: "<red><accuser> caught <player> <gray>— no UNO called, draws <count>."
  callout-wrong: "<gray><accuser> called out <player> for nothing — draws <count>."
  callout-not-allowed: "<gray>You can't call that player out."
  callout-no-target: "<red><player> isn't in your hand."

hand:
  selected: "<gray>Selected: <white><card> <dark_gray>(<index>/<count>)"
  slot-freed: "<gray>Moved <white><item> <gray>out of your hand slot to make room for your cards."
  slot-held: "<gray>Your inventory was full, so <white><item> <gray>is being held for you — you get it back when the hand ends."
  dropped: "<yellow>No room left for <white><item><yellow> — dropped at your feet."

bet:
  disabled: "<red>Gambling is disabled on this server."
  help-header: "<gold><bold>LET IT RIDE</bold> <dark_gray>— <gray>wager items or money on a hand"
  help-open: "<yellow>/gamble <gray>— open (or join) the ante at your table"
  help-stake: "<gray>  then <white>drop items onto the table <gray>to stake them"
  help-money: "<yellow>/gamble <amount> <gray>— stake cash too; items and money go in the same pot"
  help-ready: "<yellow>/gamble ready <gray>— lock your stake in · <yellow>/gamble out <gray>— take it back"
  help-pot: "<yellow>/gamble pot <gray>— what's on the line · <yellow>/gamble go <gray>— host: start now"
  help-cancel: "<yellow>/gamble cancel <gray>— host: call it off and refund everyone"
  sit-first: "<yellow>Sit at a table first <gray>(stand next to one and <gold>/uno join<gray>)<yellow>, then run <gold>/gamble<yellow>."
  in-hand-already: "<red>You're already in a hand. Finish it first."
  opened: "<gold><bold><player> opened a bet!</bold> <gray>Winner takes the pot."
  opened-hint: "<gray>Toss items onto the table to stake them, then <yellow>/gamble ready<gray>."
  opened-hint-money: "<gray>Toss items onto the table, run <yellow>/gamble <amount><gray> for cash, or <white>both<gray> — it all goes in the one pot. Then <yellow>/gamble ready<gray>."
  invited: "<gold><player> <gray>is playing this one for stakes. <join>"
  join-button: "<gold><bold>[ ANTE UP ]</bold>"
  # Shown to you alone after every stake. <stake> is your running total, so it is obvious
  # that items and cash add up rather than replacing each other.
  your-stake: "<gray>You have <stake> <gray>in. Drop more items to raise, or <lock>"
  your-stake-money: "<gray>You have <stake> <gray>in. Drop items or <yellow>/gamble <amount><gray> to raise, or <lock>"
  lock-in-button: "<green><bold>[ I'M IN ]</bold>"
  hand-in-play: "<red>A hand is already being played for this pot — wait for it to settle."
  table-busy: "<red>There's a hand running at this table already. <gray>Wait for it to finish, then open your bet."
  youre-in: "<gray>You're in. Drop items on the table to raise, then <yellow>/gamble ready<gray>."
  youre-in-money: "<gray>You're in. Drop items or <yellow>/gamble <amount><gray> to raise, then <yellow>/gamble ready<gray>."
  bet-open: "<green>The bet is open. <gray>Drop items onto the table to buy in."
  bet-open-money: "<green>The bet is open. <gray>Buy in with items on the table, cash via <yellow>/gamble <amount><gray>, or both."
  no-bet: "<gray>No bet running at your table. <yellow>/gamble <gray>opens one."
  already-playing: "<red>The hand is already being played."
  stake-first: "<yellow>Stake something first — drop items onto the table."
  min-ante: "<yellow>The minimum ante here is <min> item(s); you've staked <staked>."
  min-ante-money: "<yellow>The minimum ante here is <min> item(s) or <money>; you've staked <staked> item(s)."
  already-ready: "<gray>You're already ready. Waiting on the others."
  ready: "<green><player> is ready <gray>(<ready>/<live>)"
  not-in-bet: "<gray>You're not in this bet."
  pulled-out: "<gray><player> pulled out of the bet."
  pot-header: "<gold><bold>POT</bold> <dark_gray>— <pot> <gray>from <yellow><stakers> <gray>player(s)"
  pot-entry: "<dark_gray> · <white><player> <gray>— <stake> <dark_gray>[<status><dark_gray>]"
  pot-status-ready: "<green>ready"
  pot-status-anteing: "<yellow>anteing"
  pot-status-out: "<dark_gray>out"
  pot-in-play: "<gray>The hand is in play. Win it and it's all yours."
  host-only: "<red>Only <player> (who opened the bet) can do that."
  started-without-you: "<yellow>The bet started without you — your stake was returned."
  not-enough: "<yellow>Not enough ready players to start."
  cancelled: "<red><player> called the bet off — everything goes back."
  bots-set: "<gray>Test bots at this table: <yellow><count><gray>. They don't stake — if a bot wins, the pot is a push and everyone is refunded."
  plugin-item: "<red>That's part of the game — you can't put it in the pot."
  locked-in: "<yellow>You've already locked your stake in. <gray>/gamble out <yellow>to take it back first."
  container-blocked: "<red>You can't stake something with items inside it."
  blacklisted: "<red><item> can't be staked on this server."
  pot-limit: "<red>That would put the pot over this server's limit of <limit> item(s)."
  staked: "<yellow><player> <gray>stakes <white><amount>× <item> <dark_gray>(pot: <pot><dark_gray>)"
  staked-money: "<yellow><player> <gray>stakes <gold><money> <dark_gray>(pot: <pot><dark_gray>)"
  # --- money ---
  # <pot> and <stake> everywhere are built from these, so a pot reads the same wherever it
  # is quoted -- and names what is actually in it. <items> is the entries, one per kind of
  # item, cut off after three with stake-list-more (every one is listed on hover in chat).
  stake-list-items: "<items>"
  stake-list-money: "<gold><money>"
  stake-list-both: "<items> <gray>and <gold><money>"
  stake-list-nothing: "<gray>nothing"
  stake-list-entry: "<yellow><amount>× <white><item>"
  stake-list-separator: "<gray>, "
  stake-list-more: "<gray>+<count> more"
  money-disabled: "<red>Money wagers are switched off here. <gray>Stake items instead."
  no-economy: "<red>No economy plugin is installed, so there's no money to wager. <gray>Stake items instead."
  money-short: "<red>You don't have <amount> to stake — <gray>your balance is <balance>."
  money-limit: "<red>That would put the pot over this server's limit of <limit>."
  money-failed: "<red>The economy refused that transaction. <gray>Nothing was taken."
  table-vanished: "<red>The table vanished — refunding everyone."
  deal-failed: "<red>Couldn't deal the hand (someone's already in a game) — refunding."
  on-the-line: "<gold><bold><pot> on the line.</bold> <gray>Deal!"
  forfeit: "<red><player> walked out — their <stake> <red>stays in the pot."
  no-winner: "<gray>No winner — the pot goes back to everyone who staked it."
  bot-push: "<gray><player> (a bot) took the hand — <white>push<gray>, everyone is refunded."
  ride-won: "<gold><bold><player> takes the hand</bold> <gray>— <pot> won."
  ride-offer: "<gold>You won <pot>. "
  ride-cash-button: "[ CASH OUT ]"
  ride-cash-tip: "Take the <pot> now"
