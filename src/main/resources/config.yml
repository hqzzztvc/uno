# ============================================================
#  Legally Not Uno — configuration
# ============================================================
#
#  Every key in this file is read by the plugin. If you change something here and
#  nothing happens, that is a bug worth reporting — not an unimplemented feature.
#
#  Player-facing text lives in messages.yml, not here.
#
#  Reload with /uno reload (re-reads this file and messages.yml). A mistake in the
#  file is reported there and in the console, and the settings it last loaded with
#  stay in force until it's fixed -- nothing quietly resets to defaults.
#
#  Updating the plugin never changes a value you've set. New settings are added to
#  this file with their defaults and explanations, the old copy goes in backups/,
#  and anything this version no longer reads is named in the console on startup.

# ---- Resource Pack ----
#
#  The plugin does NOT host the pack. Either hand players the zip yourself, or
#  host it somewhere reachable and put the direct download link below — it is then
#  offered to every player as they join.
resource-pack:
  url:
    # Direct link to the pack zip. Empty = don't send a pack at all.
    link: ""
    # SHA-1 of that zip. Strongly recommended: without it clients re-download the
    # pack on every join instead of using their cache.
    sha1: ""

  # Kick players who decline the pack. Only meaningful when a link is set.
  require: false

  # Prompt shown with the download request (MiniMessage formatting).
  prompt: "<yellow>Legally Not Uno needs this resource pack for the card textures. Please accept!"

# ---- Gameplay ----
game:
  # Cards dealt to each player at the start of a hand.
  # Clamped so the deal can never empty the deck (at 6 players the ceiling is 12).
  starting-hand-size: 7

  # Seconds an idle player's turn may sit before it is played for them: they draw a
  # card and the turn passes. A pending wild colour choice is auto-picked the same way.
  # 0 disables the timer — one AFK player then stalls the table (and the pot) forever.
  turn-timeout-seconds: 60

  # Seconds of warning before that happens. 0 = no warning.
  turn-warning-seconds: 10

# ---- House rules ----
#
#  The game has no single agreed rulebook -- almost every table plays some variant, and the
#  popular ones change the game enough that they cannot all be on at once. So they are
#  toggles, and EVERY ONE IS OFF BY DEFAULT: upgrading the plugin never changes the game
#  your players are already used to.
#
#  These are read when a hand is DEALT, so /uno reload takes effect on the next hand
#  rather than mid-game.
rules:

  # Answer a +2 with your own +2 instead of drawing. The penalty piles up and lands on
  # the first player who can't (or won't) add to it.
  stacking:
    enabled: false
    # May a Wild +4 be stacked on top of a +2?
    draw4-on-draw2: true
    # May a plain +2 be stacked on top of a Wild +4? The stricter tables say no.
    draw2-on-draw4: false

  # Lay several cards of the SAME rank in one turn -- all your 7s, or two Skips at once.
  # Every card still takes effect: two Skips skip two players, two +2s are four cards.
  multi-play:
    enabled: false
    # Most cards one turn may lay. 0 = no limit.
    max-cards: 0

  # Holding the EXACT card that's showing (same colour and same rank) lets you play it
  # out of turn, and play jumps to you. Left-click it in your fan as you normally would.
  jump-in: false

  # A 7 swaps your hand with a player you pick; a 0 moves every hand one seat around
  # in the direction of play.
  seven-o: false

  # Instead of drawing one card and passing, keep drawing until something is playable
  # -- and keep the turn, so you can play it.
  draw-to-match: false

  # The official challenge rule. A Wild +4 is only legal if its player had nothing
  # matching the colour that was showing. Challenge a bluff and they draw 4 instead of
  # you; challenge an honest one and you draw 6.
  challenge-draw4: false

  # Players call their own UNO instead of the plugin doing it for them, and anyone who
  # spots a player sitting on one card without calling can catch them out.
  uno-callout:
    enabled: false
    # How long the window stays open once someone reaches one card.
    window-seconds: 5
    # Cards drawn by a player who is caught not having called.
    penalty: 2
    # Cards drawn for calling somebody out who was actually safe. Without this, calling
    # out every player on every turn would be free.
    false-callout-penalty: 2

# ---- Tables ----
#
#  A table is a 3x3 top with a stair pulled up to each side. They are REAL BLOCKS, set
#  into the world -- not display entities -- so they save with the chunk and cost nothing
#  to render.
#
#  Hand one out with /uno give <theme>, then right-click the ground with it to build it.
#  Players sit with /uno join.
#
#  There is no separate casino table. EVERY table plays both ways: the people sitting at
#  it choose, per hand, between a friendly game (/uno ready) and one for stakes
#  (/uno bet). The pot sits in the middle of the table while people ante up, and in
#  front of the winner once the hand is over.
#
#  Every table has four stairs, so max-players cannot go above 4.
#
#  Which blocks a table is made of is NOT set here. Each look is a "theme" in
#  plugins/LegallyNotUno/themes.yml: a 3x3 grid plus a block for each of the four seats, so a
#  server can design its own without a plugin rebuild. Build one in game with
#  /uno theme create <id>, or write it by hand -- that file documents its own format.
tables:
  # Most tables allowed in a single world. 0 = unlimited.
  max-per-world: 0

  # How close (in blocks) you must stand to a table for /uno join to seat you.
  join-radius: 4.0

  # Seats a hand needs and allows. A table has four stairs, so 4 is the ceiling
  # whatever you put here.
  min-players: 2
  max-players: 4

# ---- Gambling ("Let It Ride") ----
#
#  Players stake items by dropping them onto the table, or currency with /gamble <amount>;
#  the winner of the hand takes the whole pot. Everything staked is held in
#  plugins/LegallyNotUno/escrow/, so a crash or restart returns it to whoever put it in.
gambling:
  enabled: true

  # Seconds an ante may sit open before it expires and refunds everyone.
  # 0 disables the timeout (a stalled bet then holds items until someone cancels).
  ante-seconds: 300

  # Append every stake, payout, refund and forfeit to plugins/LegallyNotUno/bets.log.
  # Leave this on: it is the only record you will have when someone claims theft.
  audit-log: true

  limits:
    # Largest pot, counted in items, the table will accept. 0 = unlimited.
    max-pot-items: 0

    # Items a player must have staked before /gamble ready is accepted.
    min-ante-items: 1

    # Refuse to stake anything that can hide other items inside it (shulker boxes,
    # bundles). Without this, "one item" can be a shulker box of netherite.
    block-containers: true

    # Materials that may never be staked. An entry also matches any material ENDING
    # with it, so "SHULKER_BOX" covers all 17 dyed variants.
    blacklist:
      - SHULKER_BOX
      - BUNDLE

  # ---- Money ----
  #
  #  Wagering server currency, through Vault: /gamble 500 at a table stakes 500 of it.
  #
  #  This needs BOTH Vault and an economy plugin registered with it. With neither, the
  #  setting below does nothing and tables wager items only -- nothing breaks, and the
  #  money commands say why. Staked money leaves the player's balance immediately and is
  #  held in escrow exactly as items are, so a crash refunds it on their next join.
  money:
    enabled: true

    # Smallest money stake that counts as an ante on its own. A player meets the ante by
    # clearing EITHER this or limits.min-ante-items -- they never need both.
    min-ante: 1.0

    # Largest money pot the table will take. 0 = unlimited.
    max-pot: 0.0

  ride:
    # Offer the winner the choice to leave the pot in for another hand.
    # Off = every hand simply pays out to the winner.
    enabled: true

    # Seconds the winner has to pick cash-out vs. ride (no answer = cash out).
    window-seconds: 20

    # Seconds the table then has to match the pot and challenge the rider.
    # Anyone who staked but never locked in is refunded when this expires.
    challenge-seconds: 90

# ---- Effects ----
#
#  Sounds and particles: the card snap on the discard pile, the click as the fan
#  scrolls, the fireworks over a winner. Every one of them is bounded — nothing here
#  loops or scales with the number of players at the table.
effects:
  # All sound effects. Turning this off leaves the game fully playable, just silent.
  sounds: true

  # All particle effects.
  particles: true

  # Multiplier on every sound above, clamped to 0-2. Sounds play in the PLAYERS
  # category, so a player can also turn them down themselves.
  volume: 1.0

# ---- Updates ----
#
#  When the server starts, and whenever someone with legallynotuno.admin joins or runs
#  /uno version, Legally Not Uno asks Modrinth whether a newer release is out and tells them in
#  chat, with a link to download it. It only reads the public list of versions --
#  nothing is downloaded or installed for you.
update-checker:
  enabled: true

# ---- Debug ----
#
#  Enables the throwaway development commands (/uno testcards, /uno hand,
#  /uno cleartest, /uno fan, /uno fanclear). They spawn per-tick display entities
#  and are not meant for a live server.
debug: false

# Which layout this file is in. Legally Not Uno updates it when it updates the file -- leave it be.
config-version: 1
