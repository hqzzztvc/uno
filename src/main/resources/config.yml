# ============================================================
#  UNO Plugin Configuration
# ============================================================
#
#  Every key in this file is read by the plugin. If you change something here and
#  nothing happens, that is a bug worth reporting — not an unimplemented feature.
#
#  Player-facing text lives in messages.yml, not here.
#
#  Reload with /uno reload (re-reads this file and messages.yml).

# ---- Resource Pack ----
#
#  The plugin does NOT host the pack. Either hand players the zip yourself, or
#  host it somewhere reachable and put the direct download link below — it is then
#  offered to every player as they join.
resource-pack:
  url:
    # Direct link to the pack zip. Empty = don't send a pack at all.
    link: ""
    # SHA-1 of that zip. Strongly recommended: without it clients re-download the
    # pack on every join instead of using their cache.
    sha1: ""

  # Kick players who decline the pack. Only meaningful when a link is set.
  require: false

  # Prompt shown with the download request (MiniMessage formatting).
  prompt: "<yellow>UNO needs this resource pack for the card textures. Please accept!"

# ---- Gameplay ----
game:
  # Cards dealt to each player at the start of a hand.
  # Clamped so the deal can never empty the deck (at 6 players the ceiling is 12).
  starting-hand-size: 7

  # Seconds an idle player's turn may sit before it is played for them: they draw a
  # card and the turn passes. A pending wild colour choice is auto-picked the same way.
  # 0 disables the timer — one AFK player then stalls the table (and the pot) forever.
  turn-timeout-seconds: 60

  # Seconds of warning before that happens. 0 = no warning.
  turn-warning-seconds: 10

# ---- Tables ----
#
#  Four variants of the same table: a 3x3 chequered top of logs with a stair pulled up to
#  each side. They are REAL BLOCKS, set into the world -- not display entities -- so they
#  save with the chunk and cost nothing to render. Build one with /uno createtable <theme>
#  and it appears on the ground in front of you; players sit with /uno join.
#
#  Every table has four stairs, so max-players cannot go above 4.
#
#  blocks.* retextures a variant without touching the plugin. Any block name works:
#    top-primary    the corners and centre of the top
#    top-secondary  the four edge tiles
#    frame          unused by the single-layer top; kept so /uno remove still recognises a
#                   block an older config put there
#    seat           the stair players sit on (a stairs block, so it gets a backrest)
#  Leave a key out to keep the built-in default shown below. A name that isn't a block is
#  logged and ignored.
tables:
  # Most tables allowed in a single world. 0 = unlimited.
  max-per-world: 0

  # How close (in blocks) you must stand to a table for /uno join to seat you.
  join-radius: 4.0

  # All pink — stripped cherry keeps its colour on the sides as well as the rings.
  cherry:
    min-players: 2
    max-players: 4
    blocks:
      top-primary: STRIPPED_CHERRY_LOG
      top-secondary: STRIPPED_PALE_OAK_LOG
      frame: STRIPPED_CHERRY_LOG
      seat: CHERRY_STAIRS

  # Pink rings, dark sides — unstripped cherry bark is what makes the dark frame.
  darkcherry:
    min-players: 2
    max-players: 4
    blocks:
      top-primary: CHERRY_LOG
      top-secondary: PALE_OAK_LOG
      frame: CHERRY_LOG
      seat: PALE_OAK_STAIRS

  # Oak chequer, dark oak seats.
  oak:
    min-players: 2
    max-players: 4
    blocks:
      top-primary: OAK_LOG
      top-secondary: STRIPPED_OAK_LOG
      frame: OAK_LOG
      seat: DARK_OAK_STAIRS

  # Pale stripped oak against birch, oak seats.
  birch:
    min-players: 2
    max-players: 4
    blocks:
      top-primary: STRIPPED_OAK_LOG
      top-secondary: BIRCH_LOG
      frame: STRIPPED_OAK_LOG
      seat: OAK_STAIRS

# ---- Gambling ("Let It Ride") ----
#
#  Players stake items by dropping them onto the table; the winner of the hand takes
#  the whole pot. Staked items are held in plugins/UNO/escrow/, so a crash or restart
#  returns them to whoever put them in.
gambling:
  enabled: true

  # Seconds an ante may sit open before it expires and refunds everyone.
  # 0 disables the timeout (a stalled bet then holds items until someone cancels).
  ante-seconds: 300

  # Append every stake, payout, refund and forfeit to plugins/UNO/bets.log.
  # Leave this on: it is the only record you will have when someone claims theft.
  audit-log: true

  limits:
    # Largest pot, counted in items, the table will accept. 0 = unlimited.
    max-pot-items: 0

    # Items a player must have staked before /gamble ready is accepted.
    min-ante-items: 1

    # Refuse to stake anything that can hide other items inside it (shulker boxes,
    # bundles). Without this, "one item" can be a shulker box of netherite.
    block-containers: true

    # Materials that may never be staked. An entry also matches any material ENDING
    # with it, so "SHULKER_BOX" covers all 17 dyed variants.
    blacklist:
      - SHULKER_BOX
      - BUNDLE

  ride:
    # Offer the winner the choice to leave the pot in for another hand.
    # Off = every hand simply pays out to the winner.
    enabled: true

    # Seconds the winner has to pick cash-out vs. ride (no answer = cash out).
    window-seconds: 20

    # Seconds the table then has to match the pot and challenge the rider.
    # Anyone who staked but never locked in is refunded when this expires.
    challenge-seconds: 90

# ---- Effects ----
#
#  Sounds and particles: the card snap on the discard pile, the click as the fan
#  scrolls, the fireworks over a winner. Every one of them is bounded — nothing here
#  loops or scales with the number of players at the table.
effects:
  # All sound effects. Turning this off leaves the game fully playable, just silent.
  sounds: true

  # All particle effects.
  particles: true

  # Multiplier on every sound above, clamped to 0-2. Sounds play in the PLAYERS
  # category, so a player can also turn them down themselves.
  volume: 1.0

# ---- Debug ----
#
#  Enables the throwaway development commands (/uno testcards, /uno hand,
#  /uno cleartest, /uno fan, /uno fanclear). They spawn per-tick display entities
#  and are not meant for a live server.
debug: false
